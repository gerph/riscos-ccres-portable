name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Linux binary
        run: make -f Makefile.linux clean all

      - name: Run tests
        run: make -f Makefile.linux tests

      - name: Check the manual's field reference is up to date
        run: make -f Makefile.linux docs-check

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: 'test-results/Test-ccres.xml'
          check_name: Test Report

      - name: Build PRM-in-XML documentation
        uses: gerph/riscos-prminxml-action@v1
        with:
          files: prminxml/riscos-ccres.xml
          output: build/prminxml
          style: prm

      - name: Upload Linux binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ccres-linux
          path: ccres
          if-no-files-found: error

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v7
        with:
          name: prminxml-documentation
          path: build/prminxml
          if-no-files-found: error

  asan:
    # The same tests against an AddressSanitizer build, which reports memory
    # errors that do not crash a normal build.
    runs-on: ubuntu-latest

    permissions:
      contents: write
      checks: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests with AddressSanitizer
        run: make -f Makefile.linux tests-asan

      - name: Publish AddressSanitizer Test Report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: 'test-results/Test-ccres-asan.xml'
          check_name: AddressSanitizer Test Report
